<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATAM Bank · Banca en línea (demo)</title>
<meta name="description" content="Customer portal demo: sign in, review your transactions and dispute a charge. An AI assistant resolves what it can within limits enforced in code and hands the rest to a specialist.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e2b2a'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%239cc8bf' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body class="portal">

<!-- ============ SIGN IN ============ -->
<div id="viewLogin" class="login">
  <aside class="login-brand">
    <svg class="guil" id="guilLogin" aria-hidden="true"></svg>
    <a class="brand light" href="/portal" aria-label="LATAM Bank">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><g fill="var(--ink)"><path d="M16 6.5l10 5.5H6z"/><rect x="8.6" y="14" width="3" height="8.5" rx=".6"/><rect x="14.5" y="14" width="3" height="8.5" rx=".6"/><rect x="20.4" y="14" width="3" height="8.5" rx=".6"/><rect x="6.5" y="24" width="19" height="2.6" rx=".8"/></g></svg>
      LATAM Bank
    </a>
    <div class="login-pitch">
      <h1 data-t="pitch_h"></h1>
      <p data-t="pitch_p"></p>
    </div>
    <p class="demo-note" data-t="demo_note"></p>
  </aside>

  <main class="login-main">
    <div class="lang-sw" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <form class="login-card" id="loginForm" novalidate>
      <h2 data-t="signin_h"></h2>
      <p class="small" data-t="signin_p"></p>
      <label class="field">
        <span data-t="f_doc"></span>
        <input id="fDoc" name="document" autocomplete="off" inputmode="text" required data-tp="placeholder:ph_doc">
      </label>
      <label class="field">
        <span data-t="f_name"></span>
        <input id="fName" name="full_name" autocomplete="off" required data-tp="placeholder:ph_name">
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn-primary wide" id="loginBtn" type="submit" data-t="btn_signin"></button>
    </form>

    <section class="demo-accounts" aria-labelledby="demoTitle">
      <h3 id="demoTitle" data-t="demo_h"></h3>
      <p class="small" data-t="demo_p"></p>
      <div id="demoList" class="demo-list"></div>
    </section>
  </main>
</div>

<!-- ============ ACCOUNT ============ -->
<div id="viewApp" class="app" hidden>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/portal" aria-label="LATAM Bank">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><g fill="var(--guilloche)"><path d="M16 6.5l10 5.5H6z"/><rect x="8.6" y="14" width="3" height="8.5" rx=".6"/><rect x="14.5" y="14" width="3" height="8.5" rx=".6"/><rect x="20.4" y="14" width="3" height="8.5" rx=".6"/><rect x="6.5" y="24" width="19" height="2.6" rx=".8"/></g></svg>
        LATAM Bank
      </a>
      <span class="engine" id="engineBadge"></span>
      <div class="lang-sw" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="btn btn-ghost sm" id="helpBtn" type="button" aria-controls="assistant" aria-expanded="false" data-t="btn_assistant" data-nosub></button>
      <button class="btn btn-ghost sm" id="logoutBtn" type="button" data-t="btn_signout" data-nosub></button>
    </div>
  </header>

  <div class="wrap app-grid">
    <main class="app-main">
      <section class="hello">
        <h1 id="hello"></h1>
        <p class="small" id="helloSub"></p>
      </section>

      <section id="banner" class="banner" hidden aria-live="polite"></section>

      <section class="ledger" aria-labelledby="actTitle">
        <div class="ledger-head">
          <h2 id="actTitle" data-t="act_h"></h2>
          <span class="small" id="actRange"></span>
        </div>
        <ul class="tx-list" id="txList"></ul>
        <p class="small ledger-foot"><span data-t="foot_q" data-nosub></span> <button class="linkish" id="askBtn" type="button" data-t="foot_btn" data-nosub></button><small class="sub-en" data-tsub="foot_sub"></small></p>
      </section>

      <section class="cases" aria-labelledby="casesTitle">
        <h2 id="casesTitle" data-t="cases_h"></h2>
        <div id="caseList"></div>
      </section>
    </main>

    <aside class="assistant" id="assistant" data-ta="aria-label:as_title">
      <div class="as-head">
        <div>
          <strong data-t="as_title"></strong>
          <span class="small" id="asSub" data-t="as_sub"></span>
        </div>
        <button class="icon-btn" id="closeAs" type="button" data-ta="aria-label:as_close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="as-msgs" id="asMsgs" aria-live="polite"></div>
      <div class="chips" id="asChips"></div>
      <form class="composer" id="asForm">
        <label class="sr-only" for="asInp" data-t="lbl_msg" data-nosub></label>
        <textarea id="asInp" rows="1" data-tp="placeholder:as_ph"></textarea>
        <button class="btn btn-primary" id="asSend" type="submit" data-t="btn_send" data-nosub></button>
      </form>
    </aside>
  </div>
</div>

<script src="/portal/portal.js"></script>
</body>
</html>
